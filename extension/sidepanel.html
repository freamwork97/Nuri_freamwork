<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Nuri - Agent SidePanel</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #238636;
      --primary: #1f6feb;
      --purple: #a371f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-size: 13px; }

    header {
      background: #010409;
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-weight: 700;
      font-size: 14px;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 10px;
      background: rgba(46, 160, 67, 0.15);
      color: #3fb950;
      border: 1px solid rgba(46, 160, 67, 0.4);
      padding: 2px 6px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3fb950;
    }

    .model-selector-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .model-select {
      flex: 1;
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      outline: none;
    }

    /* Active Tab Card */
    .tab-info-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    .tab-url {
      color: #58a6ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    /* Skills Row */
    .skills-row {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: #090d13;
    }
    .skill-chip {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .skill-chip:hover {
      background: #30363d;
      color: var(--text);
      border-color: #58a6ff;
    }

    /* Chat Messages Container */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      border-radius: 8px;
      padding: 10px 12px;
      line-height: 1.5;
      font-size: 12.5px;
      word-break: break-word;
    }
    .msg.user {
      background: #1f6feb;
      color: #ffffff;
      align-self: flex-end;
      max-width: 85%;
    }
    .msg.agent {
      background: var(--card-bg);
      border: 1px solid var(--border);
      align-self: flex-start;
      max-width: 95%;
    }
    .msg.step-action {
      background: rgba(56, 139, 253, 0.1);
      border: 1px solid rgba(56, 139, 253, 0.3);
      color: #79c0ff;
      font-size: 11.5px;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .msg.result-card {
      background: rgba(35, 134, 54, 0.15);
      border: 1px solid rgba(46, 160, 67, 0.4);
      color: #e6edf3;
    }

    /* Input Footer */
    footer {
      padding: 10px 12px;
      background: #010409;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-wrapper {
      display: flex;
      gap: 6px;
    }
    .prompt-input {
      flex: 1;
      background: #161b22;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 12.5px;
      outline: none;
    }
    .prompt-input:focus {
      border-color: #58a6ff;
    }
    .btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 0 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn:hover { background: #2ea043; }
    .btn:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
    .btn-stop { background: #da3633; }
    .btn-stop:hover { background: #f85149; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="brand">
        <span>🤖</span>
        <span>Nuri</span>
      </div>
      <div class="status-badge" id="engineStatus">
        <span class="status-dot"></span>
        <span>엔진 연결됨</span>
      </div>
    </div>

    <div class="model-selector-row">
      <select id="modelSelect" class="model-select">
        <option value="gemini-3.8-flash-medium" selected>Google Gemini 3.8 Flash (구독 연동)</option>
        <option value="gpt-4o" disabled>OpenAI GPT-4o (미연동)</option>
        <option value="claude-3-5-sonnet" disabled>Anthropic Claude 3.5 Sonnet (미연동)</option>
      </select>
    </div>

    <div class="tab-info-card">
      <span>현재 탭:</span>
      <span class="tab-url" id="activeTabUrl">about:blank</span>
      <button id="refreshTabBtn" style="background:none;border:none;color:#8b949e;cursor:pointer;">🔄</button>
    </div>
  </header>

  <!-- Quick Skill Chips -->
  <div class="skills-row">
    <div class="skill-chip" data-prompt="네이버에서 오늘 주요 뉴스 요약해줘">🔍 네이버 뉴스 요약</div>
    <div class="skill-chip" data-prompt="네이버 쇼핑에서 맥북 M3 최저가 찾아줘">🛒 네이버 최저가</div>
    <div class="skill-chip" data-prompt="https://www.youtube.com 으로 이동해줘">📺 유튜브 이동</div>
    <div class="skill-chip" data-prompt="현재 페이지 내용을 3줄로 핵심 요약해줘">📄 현재 화면 요약</div>
  </div>

  <!-- Messages & Live Automation Stream -->
  <div class="messages-container" id="chatBox">
    <div class="msg agent">
      👋 <strong>AI 자동화 브라우저</strong>에 오신 것을 환영합니다!<br><br>
      상단에서 <strong>Gemini 3.8 / GPT / Claude</strong> 모델을 선택하고 명령을 입력하면, 브라우저가 직접 사이트를 탐색하고 원하는 결과를 도출합니다.
    </div>
  </div>

  <!-- Input Footer -->
  <footer>
    <div class="input-wrapper">
      <input type="text" id="promptInput" class="prompt-input" placeholder="명령을 입력하세요 (예: 네이버에서 오늘 뉴스 요약해줘)" />
      <button id="sendBtn" class="btn">🚀 실행</button>
      <button id="stopBtn" class="btn btn-stop" style="display:none;">⏹️</button>
    </div>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
