<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>AI 컴퓨터 제어 중</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    body { font: 13px/1.4 "Segoe UI", "Malgun Gothic", system-ui, sans-serif; }
    .card {
      box-sizing: border-box; height: calc(100% - 4px); margin: 2px; padding: 12px 14px;
      display: flex; align-items: center; gap: 12px;
      background: rgba(24, 24, 27, .94); color: #fafafa; border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, .08); -webkit-app-region: drag;
    }
    .pulse { flex: none; width: 10px; height: 10px; border-radius: 50%; background: #818cf8; box-shadow: 0 0 0 0 rgba(129, 140, 248, .6); animation: pulse 1.6s infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(129, 140, 248, 0); } 100% { box-shadow: 0 0 0 0 rgba(129, 140, 248, 0); } }
    .text { flex: 1; min-width: 0; }
    .title { font-weight: 600; font-size: 12px; color: #a5b4fc; display: flex; justify-content: space-between; gap: 8px; }
    .title span:last-child { color: #71717a; font-weight: 500; }
    #status { margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: #e4e4e7; }
    button {
      -webkit-app-region: no-drag; flex: none; border: 0; border-radius: 9px; padding: 8px 12px; cursor: pointer;
      background: #ef4444; color: white; font: 600 12px "Segoe UI", "Malgun Gothic", sans-serif;
    }
    button:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <div class="pulse"></div>
    <div class="text">
      <div class="title"><span>AI 제어 중 · 마우스/키보드를 잠시 쉬어 주세요</span><span>Ctrl+Alt+Q 중지</span></div>
      <div id="status">준비 중…</div>
    </div>
    <button id="stop" title="중지 (Ctrl+Alt+Q)">중지</button>
  </div>
  <script src="locales/en.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    document.getElementById('stop').onclick = () => window.overlay.stop();
    window.overlay.onStatus(({ text }) => { document.getElementById('status').textContent = text; });
  </script>
</body>
</html>
